AWSTemplateFormatVersion: "2010-09-09"
Description: CyberRakshak web and API on ECS Fargate behind an HTTPS Application Load Balancer.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC containing the supplied public and private subnets.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in separate Availability Zones for the load balancer.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets with NAT egress to ECR, Secrets Manager, and MongoDB Atlas.
  ApiImageUri:
    Type: String
    Description: Immutable ECR image URI tagged with the commit SHA.
  WebImageUri:
    Type: String
    Description: Immutable ECR image URI tagged with the commit SHA.
  MongoSecretArn:
    Type: String
    Description: Secrets Manager ARN whose SecretString is the application MongoDB URI.
  JwtSecretArn:
    Type: String
    Description: Secrets Manager ARN whose SecretString is the JWT signing secret.
  FrontendOrigin:
    Type: String
    Description: Exact HTTPS origin used by the backend CORS allowlist.
  CertificateArn:
    Type: String
    Description: ACM certificate ARN covering FrontendOrigin.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 5

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: cyberrakshak
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/cyberrakshak/api
      RetentionInDays: 30

  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/cyberrakshak/web
      RetentionInDays: 30

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadCyberRakshakRuntimeSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - Ref: MongoSecretArn
                  - Ref: JwtSecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cyberrakshak-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn:
        Fn::GetAtt: [TaskExecutionRole, Arn]
      TaskRoleArn:
        Fn::GetAtt: [TaskRole, Arn]
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: api
          Image:
            Ref: ApiImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 5000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: "5000"
            - Name: TRUST_PROXY_HOPS
              Value: "1"
            - Name: FRONTEND_URL
              Value:
                Ref: FrontendOrigin
            - Name: SOCIAL_EVIDENCE_LOOKUP_ENABLED
              Value: "true"
          Secrets:
            - Name: MONGODB_URI
              ValueFrom:
                Ref: MongoSecretArn
            - Name: JWT_SECRET
              ValueFrom:
                Ref: JwtSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: ApiLogGroup
              awslogs-region:
                Ref: AWS::Region
              awslogs-stream-prefix: api

  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cyberrakshak-web
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn:
        Fn::GetAtt: [TaskExecutionRole, Arn]
      TaskRoleArn:
        Fn::GetAtt: [TaskRole, Arn]
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: web
          Image:
            Ref: WebImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: WebLogGroup
              awslogs-region:
                Ref: AWS::Region
              awslogs-stream-prefix: web

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS entry for CyberRakshak
      VpcId:
        Ref: VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Only the ALB may reach CyberRakshak containers
      VpcId:
        Ref: VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId:
            Ref: LoadBalancerSecurityGroup
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId:
            Ref: LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: cyberrakshak
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        Ref: PublicSubnetIds
      SecurityGroups:
        - Ref: LoadBalancerSecurityGroup

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: cyberrakshak-api
      VpcId:
        Ref: VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 5000
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: cyberrakshak-web
      VpcId:
        Ref: VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckEnabled: true
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn:
            Ref: CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn:
            Ref: WebTargetGroup

  ApiPathRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Ref: HttpsListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/api/*", "/health"]
      Actions:
        - Type: forward
          TargetGroupArn:
            Ref: ApiTargetGroup

  ApiService:
    Type: AWS::ECS::Service
    DependsOn:
      - ApiPathRule
      - HttpListener
    Properties:
      ServiceName: cyberrakshak-api
      Cluster:
        Ref: Cluster
      LaunchType: FARGATE
      DesiredCount:
        Ref: DesiredCount
      TaskDefinition:
        Ref: ApiTaskDefinition
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            Ref: PrivateSubnetIds
          SecurityGroups:
            - Ref: TaskSecurityGroup
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 5000
          TargetGroupArn:
            Ref: ApiTargetGroup

  WebService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpsListener
    Properties:
      ServiceName: cyberrakshak-web
      Cluster:
        Ref: Cluster
      LaunchType: FARGATE
      DesiredCount:
        Ref: DesiredCount
      TaskDefinition:
        Ref: WebTaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            Ref: PrivateSubnetIds
          SecurityGroups:
            - Ref: TaskSecurityGroup
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 8080
          TargetGroupArn:
            Ref: WebTargetGroup

Outputs:
  LoadBalancerDnsName:
    Description: Point a DNS record for FrontendOrigin to this load balancer.
    Value:
      Fn::GetAtt: [LoadBalancer, DNSName]
