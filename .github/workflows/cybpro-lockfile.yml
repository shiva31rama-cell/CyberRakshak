name: CYBPRO Lockfile Bootstrap

on:
  push:
    branches: [cybpro-rebuild]
    paths:
      - "cybpro/package.json"
      - "cybpro/pnpm-workspace.yaml"
      - "cybpro/apps/**/package.json"
      - ".github/workflows/cybpro-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cybpro-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-lockfile:
    if: github.ref == 'refs/heads/cybpro-rebuild'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cybpro
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: cybpro-rebuild
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Generate real pnpm lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "Lockfile already exists; no bootstrap needed."
            exit 0
          fi
          pnpm install --lockfile-only
      - name: Commit lockfile to rebuild branch
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f cybpro/pnpm-lock.yaml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cybpro/pnpm-lock.yaml
            if ! git diff --cached --quiet; then
              git commit -m "build(cybpro): add reproducible pnpm lockfile"
              git push origin HEAD:cybpro-rebuild
            else
              echo "No lockfile changes to commit."
            fi
          else
            echo "Lockfile generation did not produce cybpro/pnpm-lock.yaml" >&2
            exit 1
          fi
