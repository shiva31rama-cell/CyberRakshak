name: CyberRakshak CI

on:
  push:
    branches: [main, "cyberrakshak-2.0-final"]
  pull_request:
    branches: [main, "cyberrakshak-2.0-final"]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node -c server.js
      - run: node -c controllers/chatController.js
      - run: node -c controllers/scanController.js
      - run: node -c controllers/urlScanController.js
      - run: node -c controllers/incidentController.js
      - run: node -c controllers/socialVerificationController.js
      - run: node -c services/analysis/cyberAnalysisService.js
      - run: node -c services/analysis/urlAnalysisService.js
      - run: node -c services/incident/incidentService.js
      - run: node -c services/verification/socialVerificationService.js
      - run: npm test

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
