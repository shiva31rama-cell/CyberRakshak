name: CyberRakshak CI

permissions:
  contents: read

on:
  push:
    branches: [main, "cyberrakshak-2.0-final", "codex/cyberrakshak-security-hardening"]
  pull_request:
    branches: [main, "cyberrakshak-2.0-final"]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node -c server.js
      - run: node -c controllers/chatController.js
      - run: node -c controllers/scanController.js
      - run: node -c controllers/urlScanController.js
      - run: node -c controllers/incidentController.js
      - run: node -c controllers/socialVerificationController.js
      - run: node -c services/analysis/cyberAnalysisService.js
      - run: node -c services/analysis/urlAnalysisService.js
      - run: node -c services/incident/incidentService.js
      - run: node -c services/verification/socialVerificationService.js
      - run: node -c services/ai/chatResponseContract.js
      - run: node -c scripts/mongodb-persistence-smoke.js
      - run: npm test
      - name: Optional MongoDB persistence integration
        env:
          MONGODB_TEST_URI: ${{ secrets.MONGODB_TEST_URI }}
        run: |
          if [ -n "$MONGODB_TEST_URI" ]; then
            npm run test:db
          else
            echo "SKIP: MONGODB_TEST_URI secret is not configured; live MongoDB CRUD was not tested."
          fi

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --check public/sw.js
      - run: npm run lint
      - run: npm run build
