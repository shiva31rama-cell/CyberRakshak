name: Deploy CyberRakshak to AWS ECS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cyberrakshak-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/cyberrakshak-2.0-final'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure short-lived AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: __DOLLAR__{{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: __DOLLAR__{{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: __DOLLAR__{{ steps.ecr.outputs.registry }}/__DOLLAR__{{ vars.ECR_BACKEND_REPOSITORY }}:__DOLLAR__{{ github.sha }}

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: __DOLLAR__{{ steps.ecr.outputs.registry }}/__DOLLAR__{{ vars.ECR_FRONTEND_REPOSITORY }}:__DOLLAR__{{ github.sha }}

      - name: Validate and deploy the ECS stack
        env:
          AWS_REGION: __DOLLAR__{{ vars.AWS_REGION }}
          STACK_NAME: __DOLLAR__{{ vars.AWS_STACK_NAME }}
          REGISTRY: __DOLLAR__{{ steps.ecr.outputs.registry }}
          API_REPOSITORY: __DOLLAR__{{ vars.ECR_BACKEND_REPOSITORY }}
          WEB_REPOSITORY: __DOLLAR__{{ vars.ECR_FRONTEND_REPOSITORY }}
          IMAGE_TAG: __DOLLAR__{{ github.sha }}
          VPC_ID: __DOLLAR__{{ vars.AWS_VPC_ID }}
          PUBLIC_SUBNET_IDS: __DOLLAR__{{ vars.AWS_PUBLIC_SUBNET_IDS }}
          PRIVATE_SUBNET_IDS: __DOLLAR__{{ vars.AWS_PRIVATE_SUBNET_IDS }}
          MONGODB_SECRET_ARN: __DOLLAR__{{ vars.AWS_MONGODB_SECRET_ARN }}
          JWT_SECRET_ARN: __DOLLAR__{{ vars.AWS_JWT_SECRET_ARN }}
          FRONTEND_ORIGIN: __DOLLAR__{{ vars.AWS_FRONTEND_ORIGIN }}
          CERTIFICATE_ARN: __DOLLAR__{{ vars.AWS_CERTIFICATE_ARN }}
        run: |
          aws cloudformation deploy \
            --template-file deployment/aws/ecs.yml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              VpcId="$VPC_ID" \
              PublicSubnetIds="$PUBLIC_SUBNET_IDS" \
              PrivateSubnetIds="$PRIVATE_SUBNET_IDS" \
              ApiImageUri="$REGISTRY/$API_REPOSITORY:$IMAGE_TAG" \
              WebImageUri="$REGISTRY/$WEB_REPOSITORY:$IMAGE_TAG" \
              MongoSecretArn="$MONGODB_SECRET_ARN" \
              JwtSecretArn="$JWT_SECRET_ARN" \
              FrontendOrigin="$FRONTEND_ORIGIN" \
              CertificateArn="$CERTIFICATE_ARN"
