name: CyberRakshak Threat Intelligence

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest-certin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ingest CERT-In advisories
        run: node scripts/ingest-certin.js

      - name: Commit refreshed intelligence
        run: |
          if git diff --quiet -- data/threats/ingested/cert-in-latest.json; then
            echo "No threat intelligence changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/threats/ingested/cert-in-latest.json
          git commit -m "chore: refresh CERT-In threat intelligence"
          git push
