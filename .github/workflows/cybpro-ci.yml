name: CYBPRO CI

on:
  push:
    branches: [cybpro-rebuild]
    paths:
      - "cybpro/**"
      - ".github/workflows/cybpro-ci.yml"
  pull_request:
    paths:
      - "cybpro/**"
      - ".github/workflows/cybpro-ci.yml"
  workflow_dispatch:

concurrency:
  group: cybpro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cybpro
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run API tests
        run: pnpm test
      - name: Build web and type-check API and mobile
        run: pnpm build
